          <div class="card" style="flex:1; display:flex; flex-direction:column; padding:16px; min-height:0;">
            <h3 style="margin:0 0 10px 0; font-family:var(--fonte-display); font-size:16px;">💳 Por Forma de Pagamento</h3>
            <div class="tabela-scroll">
              <table class="tabela">
                <thead><tr><th>Forma</th><th class="col-centro">Vendas</th><th class="col-num">Total</th></tr></thead>
                <tbody id="rel-tbody-pagamento"></tbody>
              </table>
            </div>
          </div>

          <div class="card" style="flex:1; display:flex; flex-direction:column; padding:16px; min-height:0;">
            <h3 style="margin:0 0 10px 0; font-family:var(--fonte-display); font-size:16px;">👤 Por Operador</h3>
            <div class="tabela-scroll">
              <table class="tabela">
                <thead><tr><th>Operador</th><th class="col-centro">Vendas</th><th class="col-num">Total</th></tr></thead>
                <tbody id="rel-tbody-operador"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    `;
  },

  async montar() {
    document.getElementById("rel-filtro-tudo").addEventListener("click", () => this._mudarFiltro(false));
    document.getElementById("rel-filtro-hoje").addEventListener("click", () => this._mudarFiltro(true));
    this._atualizarBotoesFiltro();
    await this.atualizar();
  },

  _atualizarBotoesFiltro() {
    document.getElementById("rel-filtro-tudo").className = "btn " + (!this.apenasHoje ? "btn-primaria" : "btn-fantasma");
    document.getElementById("rel-filtro-hoje").className = "btn " + (this.apenasHoje ? "btn-primaria" : "btn-fantasma");
    document.getElementById("rel-filtro-tudo").style.cssText += "padding:7px 14px; font-size:12.5px;";
    document.getElementById("rel-filtro-hoje").style.cssText += "padding:7px 14px; font-size:12.5px;";
  },

  async _mudarFiltro(hoje) {
    this.apenasHoje = hoje;
    this._atualizarBotoesFiltro();
    await this.atualizar();
  },

  async atualizar() {
    // Carrega todas as fontes de dados em paralelo (mais rápido)
    const [resumo, top, porPagamento, porOperador] = await Promise.all([
      App.db.resumoVendas(this.apenasHoje),
      App.db.produtosMaisVendidos(10, this.apenasHoje),
      App.db.vendasPorFormaPagamento(),
      App.db.vendasPorOperador(),
    ]);

    const totalVendido = resumo.total_vendido || 0;
    const qtdVendas = resumo.qtd_vendas || 0;
    document.getElementById("rel-card-total").textContent = formatarMoeda(totalVendido);
    document.getElementById("rel-card-qtd").textContent = String(qtdVendas);
    document.getElementById("rel-card-ticket").textContent = formatarMoeda(qtdVendas ? totalVendido / qtdVendas : 0);

    document.getElementById("rel-tbody-top").innerHTML = top.length === 0
      ? `<tr><td colspan="3" class="vazio">Sem vendas no período.</td></tr>`
      : top.map(p => `
          <tr>
            <td>${escapeHtml(p.produto_nome)}</td>
            <td class="col-centro">${p.total_qtd}</td>
            <td class="col-num">${formatarMoeda(p.total_valor)}</td>
          </tr>
        `).join("");

    document.getElementById("rel-tbody-pagamento").innerHTML = porPagamento.length === 0
      ? `<tr><td colspan="3" class="vazio">Sem vendas registradas.</td></tr>`
      : porPagamento.map(l => `
          <tr>
            <td>${escapeHtml(l.forma_pagamento)}</td>
            <td class="col-centro">${l.qtd}</td>
            <td class="col-num">${formatarMoeda(l.total)}</td>
          </tr>
        `).join("");

    document.getElementById("rel-tbody-operador").innerHTML = porOperador.length === 0
      ? `<tr><td colspan="3" class="vazio">Sem vendas registradas.</td></tr>`
      : porOperador.map(o => `
          <tr>
            <td>${escapeHtml(o.operador_nome)}</td>
            <td class="col-centro">${o.qtd}</td>
            <td class="col-num">${formatarMoeda(o.total)}</td>
          </tr>
        `).join("");
  },
};

</script>
<script>
"use strict";

/* ======================================================================
   TELA DE OPERADORES — cadastro e gerenciamento de operadores de caixa
   Visível apenas para quem logou como administrador (operador.admin=1).
   ====================================================================== */

const TelaOperadores = {
  operadorEmEdicaoId: null,

  render() {
    return `
      <h2 class="titulo-pagina" style="margin-bottom:12px;">👤 Operadores</h2>
      <div style="display:flex; gap:16px; flex:1; min-height:0;">

        <div class="card" style="flex:1; padding:16px; overflow:auto;">
          <h3 style="margin:0 0 14px 0; font-family:var(--fonte-display); font-size:18px;">Cadastro de Operador</h3>

          <label class="campo-label" style="margin-top:0;">Nome</label>
          <input type="text" id="op-campo-nome" placeholder="Nome do operador">

          <label class="campo-label">PIN (4 a 8 dígitos)</label>
          <input type="password" id="op-campo-pin" placeholder="Deixe em branco para manter o PIN atual" inputmode="numeric">

          <label class="campo-label" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="op-campo-admin"> Administrador (acessa tela de operadores)
          </label>

          <div style="display:flex; gap:8px; margin-top:16px;">
            <button class="btn btn-primaria" id="op-btn-salvar" style="flex:1;">+ Cadastrar Operador</button>
            <button class="btn btn-fantasma" id="op-btn-limpar" style="flex:1;">Limpar</button>
          </div>

          <button class="btn btn-perigo" id="op-btn-remover" style="width:100%; margin-top:8px;" disabled>Desativar Operador Selecionado</button>
        </div>

        <div class="card" style="flex:2; display:flex; flex-direction:column; padding:16px; min-height:0;">
          <h3 style="margin:0 0 12px 0; font-family:var(--fonte-display); font-size:18px;">Operadores Cadastrados</h3>
          <div class="tabela-scroll">
            <table class="tabela">
              <thead><tr><th>Nome</th><th class="col-centro">Perfil</th><th class="col-centro">Situação</th></tr></thead>
              <tbody id="op-tbody-lista"></tbody>
            </table>
          </div>
        </div>

      </div>
    `;
  },

  async montar() {
    document.getElementById("op-btn-salvar").addEventListener("click", () => this._salvar());
    document.getElementById("op-btn-limpar").addEventListener("click", () => this._limparFormulario());
    document.getElementById("op-btn-remover").addEventListener("click", () => this._remover());
    await this.atualizarLista();
  },

  _validarFormulario() {
    const nome = document.getElementById("op-campo-nome").value.trim();
    if (!nome) { mostrarToast("Informe o nome do operador.", "erro"); return null; }

    const pin = document.getElementById("op-campo-pin").value.trim();
    const isNovo = this.operadorEmEdicaoId === null;

    if (isNovo && !pin) {
      mostrarToast("Informe um PIN para o novo operador.", "erro"); return null;
    }
    if (pin && (pin.length < 4 || pin.length > 8 || !/^\d+$/.test(pin))) {
      mostrarToast("O PIN deve ter entre 4 e 8 dígitos numéricos.", "erro"); return null;
    }

    const admin = document.getElementById("op-campo-admin").checked;
    return { nome, pin: pin || null, admin };
  },

  async _salvar() {
    const dados = this._validarFormulario();
    if (!dados) return;
    const { nome, pin, admin } = dados;

    if (this.operadorEmEdicaoId === null) {
      await App.db.adicionarOperador(nome, pin, admin);
      mostrarToast(`Operador "${nome}" cadastrado.`);
    } else {
      await App.db.editarOperador(this.operadorEmEdicaoId, nome, admin, pin);
      mostrarToast(`Operador "${nome}" atualizado.`);
    }

    this._limparFormulario();
    await this.atualizarLista();
  },

  async _selecionarOperador(operadorId) {
    const todos = await App.db.listarOperadores(false);
    const op = todos.find(o => o.id === operadorId);
    if (!op) return;

    this.operadorEmEdicaoId = operadorId;
    document.getElementById("op-campo-nome").value = op.nome;
    document.getElementById("op-campo-pin").value = "";
    document.getElementById("op-campo-admin").checked = op.admin === 1;

    const btnSalvar = document.getElementById("op-btn-salvar");
    btnSalvar.textContent = "💾 Salvar Alterações";
    btnSalvar.classList.replace("btn-primaria", "btn-secundaria");

    document.getElementById("op-btn-remover").disabled = false;
    this._marcarLinhaSelecionada();
  },

  _limparFormulario() {
    this.operadorEmEdicaoId = null;
    document.getElementById("op-campo-nome").value = "";
    document.getElementById("op-campo-pin").value = "";
    document.getElementById("op-campo-admin").checked = false;

    const btnSalvar = document.getElementById("op-btn-salvar");
    btnSalvar.textContent = "+ Cadastrar Operador";
    btnSalvar.classList.replace("btn-secundaria", "btn-primaria");

    document.getElementById("op-btn-remover").disabled = true;
    this._marcarLinhaSelecionada();
  },

  async _remover() {
    if (this.operadorEmEdicaoId === null) return;
    // Não pode desativar a si mesmo — isso travaria o sistema
    if (App.operadorAtual && App.operadorAtual.id === this.operadorEmEdicaoId) {
      mostrarToast("Você não pode desativar o operador atualmente logado.", "erro");
      return;
    }
    const todos = await App.db.listarOperadores(false);
    const op = todos.find(o => o.id === this.operadorEmEdicaoId);
    if (!op) return;

    const ok = await confirmarAcao("Desativar operador", `Desativar "${op.nome}"? Ele não poderá mais entrar no sistema.`);
    if (!ok) return;

    await App.db.removerOperador(this.operadorEmEdicaoId);
    this._limparFormulario();
    await this.atualizarLista();
    mostrarToast(`Operador "${op.nome}" desativado.`);
  },

  _marcarLinhaSelecionada() {
    const tbody = document.getElementById("op-tbody-lista");
    if (!tbody) return;
    tbody.querySelectorAll("tr[data-op-id]").forEach(tr => {
      tr.classList.toggle("selecionada", Number(tr.dataset.opId) === this.operadorEmEdicaoId);
    });
  },

  async atualizarLista() {
    const todos = await App.db.listarOperadores(false);
    const tbody = document.getElementById("op-tbody-lista");
    if (!tbody) return;

    if (todos.length === 0) {
      tbody.innerHTML = `<tr><td colspan="3" class="vazio">Nenhum operador cadastrado.</td></tr>`;
      return;
    }

    tbody.innerHTML = todos.map(o => `
      <tr data-op-id="${o.id}" class="${o.id === this.operadorEmEdicaoId ? "selecionada" : ""} ${o.ativo === 0 ? "linha-baixa" : ""}">
        <td>${escapeHtml(o.nome)}</td>
        <td class="col-centro">${o.admin === 1 ? "Admin" : "Operador"}</td>
        <td class="col-centro">${o.ativo === 1 ? "✓ Ativo" : "✗ Inativo"}</td>
      </tr>
    `).join("");

    tbody.querySelectorAll("tr[data-op-id]").forEach(tr => {
      tr.addEventListener("click", () => this._selecionarOperador(Number(tr.dataset.opId)));
    });
  },
};

</script>
<script>
"use strict";

/* ======================================================================
   APP — orquestração geral: banco compartilhado, navegação entre
   páginas e sincronização entre telas (equivalente ao main.py).
   ====================================================================== */

const App = {
  db: null,
  paginaAtual: null,
  operadorAtual: null,
  paginas: {
    vendas: TelaVendas,
    produtos: TelaProdutos,
    historico: TelaHistorico,
    relatorios: TelaRelatorios,
    operadores: TelaOperadores,
  },

  async iniciar() {
    this.db = new Database();
    await this.db.pronto();

    // Mostra a tela de login antes de qualquer coisa
    await TelaLogin.montar();
    TelaLogin.mostrar();

    this._configurarBackup();
    this._configurarAtalhos();

    document.getElementById("btn-trocar-operador").addEventListener("click", () => {
      this.operadorAtual = null;
      TelaLogin.mostrar();
    });
  },

  // Chamado pela TelaLogin assim que o PIN é validado com sucesso.
  async aoLogar(operador) {
    this.operadorAtual = operador;
    TelaLogin.ocultar();

    // Mostra o botão de Operadores só para admins
    const navOp = document.getElementById("nav-operadores");
    if (navOp) navOp.classList.toggle("oculto", operador.admin !== 1);

    // Exibe o nome e perfil do operador na sidebar
    const infoEl = document.getElementById("operador-info");
    if (infoEl) {
      infoEl.innerHTML = `Olá, <strong>${escapeHtml(operador.nome)}</strong><br>${operador.admin === 1 ? "Administrador" : "Operador"}`;
    }

    document.querySelectorAll(".nav-botao").forEach(btn => {
      btn.addEventListener("click", () => this.mostrarPagina(btn.dataset.pagina));
    });

    await this.mostrarPagina("vendas");
  },

  // Atalhos globais de teclado (apenas quando a tela de PDV está visível).
  _configurarAtalhos() {
    document.addEventListener("keydown", (ev) => {
      // Ignora quando o foco está em um input ou o modal está aberto
      const tagAtiva = document.activeElement?.tagName;
      const modalAberto = document.getElementById("overlay-modal")?.classList.contains("visivel");
      const loginVisivel = !document.getElementById("tela-login")?.classList.contains("oculto");

      if (loginVisivel || modalAberto) return;
      if (tagAtiva === "INPUT" || tagAtiva === "SELECT" || tagAtiva === "TEXTAREA") return;

      if (ev.key === "F2") {
        ev.preventDefault();
        if (this.paginaAtual === "vendas") TelaVendas._finalizarVenda();
      }
      if (ev.key === "F3") {
        ev.preventDefault();
        if (this.paginaAtual === "vendas") TelaVendas._cancelarVenda();
      }
    });
  },

  _configurarBackup() {
    document.getElementById("btn-exportar-backup").addEventListener("click", () => this._exportarBackup());

    const inputArquivo = document.getElementById("input-importar-backup");
    document.getElementById("btn-importar-backup").addEventListener("click", () => inputArquivo.click());
    inputArquivo.addEventListener("change", (ev) => this._importarBackup(ev));
  },

  async _exportarBackup() {
    try {
      const dados = await this.db.exportarTudo();
      const json = JSON.stringify(dados, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);

      const carimboData = new Date().toISOString().slice(0, 10);
      const a = document.createElement("a");
      a.href = url;
      a.download = `backup_pdv_lanchonete_${carimboData}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      mostrarToast("Backup exportado com sucesso.");
    } catch (err) {
      console.error(err);
      mostrarToast("Não foi possível exportar o backup.", "erro");
    }
  },

  async _importarBackup(ev) {
    const arquivo = ev.target.files[0];
    ev.target.value = "";
    if (!arquivo) return;

    const ok = await confirmarAcao(
      "Importar backup",
      "Isso vai substituir TODOS os dados atuais (produtos, vendas e histórico) pelos dados do arquivo selecionado. Essa ação não pode ser desfeita. Deseja continuar?"
    );
    if (!ok) return;

    try {
      const texto = await arquivo.text();
      const dados = JSON.parse(texto);

      if (!dados || !Array.isArray(dados.produtos) || !Array.isArray(dados.vendas) || !Array.isArray(dados.itens_venda)) {
        mostrarToast("Não foi possível importar este arquivo. Verifique se é um backup válido.", "erro");
        return;
      }

      await this.db.importarTudo(dados);
      mostrarToast("Backup importado com sucesso.");
      await this.mostrarPagina(this.paginaAtual || "vendas");
    } catch (err) {
      console.error(err);
      mostrarToast("Não foi possível importar este arquivo. Verifique se é um backup válido.", "erro");
    }
  },

  async mostrarPagina(chave) {
    const tela = this.paginas[chave];
    if (!tela) return;

    const conteudo = document.getElementById("conteudo");
    conteudo.innerHTML = `<div class="pagina ativa">${tela.render()}</div>`;
    await tela.montar();

    this.paginaAtual = chave;

    document.querySelectorAll(".nav-botao").forEach(btn => {
      btn.classList.toggle("ativo", btn.dataset.pagina === chave);
    });

    await this._atualizarBadgeEstoque();
  },

  async atualizarTudo() {
    // Chamado após uma venda ser concluída ou um produto ser alterado,
    // para manter a tela atual e o badge sincronizados. Diferente da
    // versão desktop original (que atualizava todas as telas de uma
    // vez, mesmo as ocultas), aqui só a página visível precisa
    // recarregar — as outras se atualizam sozinhas ao serem abertas
    // via mostrarPagina(), o que evita trabalho desnecessário.
    const tela = this.paginas[this.paginaAtual];
    if (tela && tela.atualizarTudo) await tela.atualizarTudo();
    else if (tela && tela.atualizar) await tela.atualizar();
    else if (tela && tela.atualizarLista) await tela.atualizarLista();

    await this._atualizarBadgeEstoque();
  },

  async _atualizarBadgeEstoque() {
    const baixos = await this.db.produtosEstoqueBaixo();
    const el = document.getElementById("badge-estoque");
    if (baixos.length > 0) {
      el.innerHTML = `⚠ ${baixos.length} produto(s)<br>com estoque baixo`;
      el.classList.add("visivel");
    } else {
      el.classList.remove("visivel");
    }
  },
};

window.addEventListener("DOMContentLoaded", () => {
  App.iniciar().catch(err => {
    console.error(err);
    alert("Erro ao iniciar o PDV: " + err.message);
  });
});
</script>
